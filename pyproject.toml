[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cowork"
version = "0.1.0"
description = "Git-based multi-agent collaboration protocol for 无影 Computer Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cowork = "cowork.cli:main"

[tool.setuptools.packages.find]
include = ["cowork*"]

[tool.setuptools.package-data]
cowork = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs SSH Agent Computers or GitHub",
]
